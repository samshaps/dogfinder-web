name: Keyword research refresh

# Re-runs the free keyword research pipeline on the first Monday of each month
# (and on demand) and opens a pull request with the refreshed report, scored
# keywords, and regenerated Google Ads import files for review.

on:
  schedule:
    - cron: '17 11 1-7 * 1'
  workflow_dispatch:
    inputs:
      write_import_files:
        description: 'Regenerate docs/ads/keywords.csv and negative-keywords.csv'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/keyword-research/requirements.txt

      - run: pip install -r scripts/keyword-research/requirements.txt

      - name: Run research
        env:
          # Optional: adds listing supply per breed and city to the report.
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.write_import_files }}" = "true" ]; then
            FLAGS="--write-import-files"
          fi
          python3 scripts/keyword-research/research.py $FLAGS

      - name: Open pull request with results
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/keyword-research
          delete-branch: true
          commit-message: 'chore(ads): refresh keyword research'
          title: 'Keyword research refresh'
          body: |
            Monthly keyword research refresh from Google/Bing autocomplete, Google Trends, and Wikimedia pageviews.

            Review `docs/ads/research/REPORT.md` first. If the regenerated `docs/ads/keywords.csv` and
            `docs/ads/negative-keywords.csv` look right, import them with Google Ads Editor after merging.
          add-paths: |
            docs/ads/**
